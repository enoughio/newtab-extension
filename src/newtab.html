<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desktop" id="desktop">
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
    <div class="dim" id="dim" aria-hidden="true"></div>

    <div class="hint" id="hint" hidden>
      <p id="hint-text">Drag widgets from the side panel onto the grid. The + button adds a shortcut or a folder.</p>
      <button type="button" class="hint-dismiss" id="hint-dismiss" aria-label="Dismiss hint">×</button>
    </div>

    <main class="stage" id="stage">
      <div class="home-grid" id="grid" aria-label="Home screen"></div>
      <div class="corner-actions">
        <button type="button" class="text-btn" id="widgets-btn" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"></rect>
          <rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor" opacity=".72"></rect>
          <rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" opacity=".72"></rect>
          <rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"></rect>
        </svg>
          Widgets
        </button>
        <button type="button" class="icon-btn" id="add-btn" aria-label="Add shortcut or folder">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        </button>
        <button type="button" class="icon-btn" id="gear-btn" aria-label="Theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" stroke-linecap="round"></path>
        </svg>
        </button>
      </div>
    </main>
  </div>

  <div class="drawer-back" id="drawer-back"></div>
  <aside class="drawer" id="drawer" aria-label="Widgets" aria-hidden="true">
    <header class="drawer-head">
      <h2>Widgets</h2>
      <p>Drag a widget onto the home screen.</p>
    </header>
    <div class="drawer-list" id="drawer-list"></div>
  </aside>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <section class="sheet" id="customize-sheet" hidden aria-label="Theme"></section>
  <section class="sheet" id="add-sheet" hidden aria-label="Add shortcut or folder"></section>

  <div class="folder-layer" id="folder-layer" hidden>
    <div class="folder-panel" id="folder-panel" role="dialog" aria-modal="true" aria-labelledby="folder-title">
      <header class="folder-head">
        <h2 id="folder-title"></h2>
        <button type="button" class="icon-btn" id="folder-close" aria-label="Close folder">×</button>
      </header>
      <div class="folder-body" id="folder-body"></div>
    </div>
  </div>

  <div class="drag-chip" id="drag-chip" hidden aria-hidden="true"></div>
  <div class="prohibit" id="prohibit" hidden aria-hidden="true">
    <svg viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="16" fill="rgba(28, 6, 6, 0.55)" stroke="#ff453a" stroke-width="3.5"></circle>
      <path d="M15.5 32.5 32.5 15.5" stroke="#ff453a" stroke-width="3.5" stroke-linecap="round"></path>
    </svg>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
